[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-audiobook"
version = "1.0.0"
description = "Turn any PDF into chapter-split audiobook narration."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Prakhar Srivastava" }]
keywords = ["pdf", "audiobook", "tts", "text-to-speech", "accessibility"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

dependencies = [
    "PyMuPDF>=1.24.0",
    "edge-tts>=7.0.0",
    "pyttsx3>=2.90",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
# The drag-and-drop web UI: `streamlit run app.py`
ui = ["streamlit>=1.31.0"]

# The REST service: `uvicorn pdf_audiobook.api:app`
api = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.9",
    "prometheus-client>=0.20.0",
]

dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
    "httpx>=0.27.0",
]

[project.scripts]
pdf-audiobook = "pdf_audiobook.cli:main"

[project.urls]
Homepage = "https://github.com/prakhar-189/PDF-to-AudioBook-Converter"

[tool.setuptools.packages.find]
include = ["pdf_audiobook*"]

# ---------------------------------------------------------------------------
# lint
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py39"
extend-exclude = ["venv", ".venv", "audiobooks"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import sorting
    "B",        # bugbear
    "C4",       # comprehensions
    "UP",       # pyupgrade
    "SIM",      # simplify
    "RUF",      # ruff-specific
    "BLE",      # blind except
]
ignore = [
    "E501",    # line length is handled by the formatter, not the linter
    "B008",    # FastAPI's Depends()/File() defaults are the documented idiom
    "UP007",   # `X | Y` needs 3.10; this package supports 3.9
    "UP045",
]

[tool.ruff.lint.per-file-ignores]
# Tests reach into private helpers deliberately - that is the unit under test.
"tests/*" = ["SLF001"]
# This module's entire job is normalising ambiguous unicode punctuation, so the
# ligatures, curly quotes and non-breaking hyphens in it are the data, not a typo.
"pdf_audiobook/extract.py" = ["RUF001"]

# ---------------------------------------------------------------------------
# tests
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "network: needs the voice service (deselected by default in CI)",
]
filterwarnings = [
    "error::DeprecationWarning:pdf_audiobook.*",
]

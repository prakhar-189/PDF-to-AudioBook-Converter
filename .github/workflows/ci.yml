name: ci

# Lint, unit tests and a container build. The accuracy gate lives in its own
# workflow (eval.yml) because it answers a different question: this one asks
# "is the code correct", that one asks "is the extraction still accurate".
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff
      - name: ruff check
        run: ruff check --output-format=github .

  test:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # bash on every OS. The default shell on windows-latest is PowerShell,
        # where a Unix-ism like `> /dev/null` fails with a directory error -
        # and the point of the Windows job is to test the code, not the YAML.
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12"]
        include:
          # One Windows run: this is where the filename sanitising in
          # safe_name() actually matters, and it is the author's own platform.
          - os: windows-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        # The api extra brings FastAPI in so the service tests run rather than
        # skip. pyttsx3 comes with the package but is never exercised here -
        # a CI runner has no speech engine, so the tests use a stub.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[api,dev]"

      - name: pytest
        run: pytest -q

      - name: Package imports without the optional extras
        # A fresh `pip install pdf-audiobook` gets no FastAPI and no Streamlit.
        # The CLI still has to work, or the default install is broken.
        run: |
          python -c "import pdf_audiobook, pdf_audiobook.cli; print(pdf_audiobook.__version__)"
          python -m pdf_audiobook --help > /dev/null

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: pdf-audiobook:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: The service starts and answers /healthz
        # Building an image that cannot boot is the failure this catches.
        run: |
          docker run -d --name api -p 8000:8000 pdf-audiobook:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/healthz; then
              echo "healthy"; exit 0
            fi
            sleep 2
          done
          echo "service did not become healthy"; docker logs api; exit 1

      - name: Stop
        if: always()
        run: docker rm -f api || true
